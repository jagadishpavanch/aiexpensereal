# On every push to main: run the tests, then build the web app and publish it as
# an over-the-air update for the Android app, as a GitHub Release tagged ota-<version>
# with the zip and manifest.json attached. Phones read releases/latest/download/manifest.json,
# download in the background and switch on their next restart.
#
# Publishing uses the workflow's own GITHUB_TOKEN; no secret is needed.
# Repository variables the build reads: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY.
name: OTA update

on:
  push:
    branches: [main]
  # Pull requests get the type-check and tests only, so a broken change is caught before it merges.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ota-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here may write to the repo by default; only the publish job below gets write access.
permissions:
  contents: read

jobs:
  # Installs packages, tests and packages the bundle with a read-only token, so a bad npm package
  # can't publish an update to every phone.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Not `npm ci`: npm on Windows and on Linux disagree about the optional WebAssembly
      # packages in package-lock.json, and `npm ci` then refuses to install at all.
      - run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Test
        run: npx vitest run

      # Version = <major>.<minor> from package.json, patch = this workflow's run number,
      # so every publish is newer than the last and newer than the APK's built-in 1.0.0.
      # minNativeVersion = the APK's versionName: bump it in android/app/build.gradle
      # whenever native code or plugins change, so old APKs don't load JS they can't run.
      - name: Package bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pkg
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          version="$base.${{ github.run_number }}"
          native=$(node -p "/versionName\s+\"([^\"]+)\"/.exec(require('fs').readFileSync('android/app/build.gradle','utf8'))[1]")
          node scripts/package-ota.mjs --version "$version" --min-native "$native" --notes "${{ github.sha }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Keep the bundle for the publish job
        if: steps.pkg.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ota-bundle
          path: dist-ota/
          retention-days: 1

    outputs:
      version: ${{ steps.pkg.outputs.version }}

  # Publishes what build packaged. Runs no npm code, and only for main: a manual run on another branch
  # used to publish that branch to every phone as the latest update.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ota-bundle
          path: dist-ota

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.build.outputs.version }}
        run: |
          gh release create "ota-$V" "dist-ota/extrack-$V.zip" dist-ota/manifest.json \
            --title "App update $V" --target "${{ github.sha }}" --latest \
            --notes "Over-the-air update for the Android app, built from ${{ github.sha }}."
          # Keep the 5 newest updates; phones only ever need the latest.
          gh release list --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("ota-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
